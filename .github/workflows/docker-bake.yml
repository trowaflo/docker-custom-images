      #     docker build . --tag ghcr.io/${{ github.actor }}/guacamole/guacamole-helper
      #     docker run ghcr.io/${{ github.actor }}/guacamole/guacamole-helper
      #     docker push ghcr.io/${{ github.actor }}/guacamole/guacamole-helper
